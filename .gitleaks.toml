# Gitleaks configuration for Platform.Bible.
#
# Extends gitleaks' default ruleset unchanged and adds exactly one narrow, rule-scoped allowlist
# entry below. It suppresses ONLY the `generic-api-key` rule for ONE file - every other rule
# (AWS keys, private keys, GitHub/GitLab tokens, Stripe keys, etc.) keeps scanning that file and
# every other rule keeps scanning everywhere else in the repository. Do not widen this file's
# scope without discussing it; it exists to fix one specific, understood false positive, not to
# relax secret scanning generally.

[extend]
useDefault = true

[[allowlists]]
description = '''
SPDX license-corpus checksum index (.erb/scripts/third-party-notices/spdx-corpus/index.json, see
.erb/scripts/third-party-notices/corpus.js). It maps ~600 SPDX license identifiers to the sha256
of their canonical text from the pinned `spdx-license-list` dependency. A handful of identifiers -
"TermReadKey", "HIDAPI", "ssh-keyscan" - are real SPDX license ids (SPDX names licenses after the
real-world tools/projects they cover) that happen to contain "key"/"api"-like substrings, and each
sits directly beside its 64-char hex sha256 value in the JSON. That shape trips ONLY the
generic-api-key heuristic (a "key"/"api"-like name immediately adjacent to a long hex value) - the
values themselves are public sha256 digests of publicly published license text, deterministically
reproducible from `npm install spdx-license-list`, not secrets. Scoped to targetRules below so a
real secret pasted into this file by mistake is still caught by every other rule (AWS keys,
private keys, GitHub/GitLab tokens, etc.).
'''
targetRules = ["generic-api-key"]
paths = [
  '''^\.erb/scripts/third-party-notices/spdx-corpus/index\.json$''',
]
