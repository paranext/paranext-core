name: Library dist recheck

# After a library change lands on a base branch, open library pull requests into it may no longer
# merge into a current dist. Mark each pending so none merges on an old success, then re-run that
# pull request's own check run: it re-resolves the base tip when it starts. A run still in progress
# is cancelled first. Runs only base-branch code; it never builds or executes pull request code, and
# the pull request code only ever runs in the pull request's own check run.
# No concurrency group: a duplicate re-run is harmless, because the check's per-pull-request group
# cancels the older run.
on:
  push:
    branches: ['main', 'release-prep', 'hotfix-*', 'ai/main']

permissions:
  contents: read
  pull-requests: read
  statuses: write
  actions: write

jobs:
  recheck-open-pull-requests:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      # Events caused by GITHUB_TOKEN do not create workflow runs, so a re-run requested with it may not
      # start the report workflow. If re-checked pull requests stay pending, request the re-run with a
      # GitHub App token (Actions: read and write) instead.
      - name: Re-run the check of each open library pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]; then
            CHANGED=$(git diff --name-only "$BEFORE_SHA" HEAD | node .erb/scripts/library-dist/classify-library-change.ts)
            [ "$CHANGED" = true ] || { echo "No library changes; nothing to re-check"; exit 0; }
          fi
          PULL_REQUESTS=$(gh pr list --base "$GITHUB_REF_NAME" --state open --limit 200 --json number,headRefOid,files \
            | node .erb/scripts/library-dist/select-library-prs.ts)

          # Re-runs the latest pull_request check run of one pull request head commit.
          recheck() {
            local pr="$1" sha="$2" run run_id run_status waited=0
            # Captured first so a failed lookup fails the step while an empty result (no run yet) skips.
            run=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/library-dist-check.yml/runs?event=pull_request&head_sha=$sha&per_page=1" \
              --jq '(.workflow_runs[0] // empty) | "\(.id) \(.status)"') || return 1
            if [ -z "$run" ]; then
              echo "::warning::No check run found for pull request #$pr at $sha; skipping"
              return 0
            fi
            read -r run_id run_status <<< "$run"
            if [ "$run_status" != completed ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" || return 1
              while [ "$run_status" != completed ]; do
                if [ "$waited" -ge 120 ]; then
                  echo "::warning::Check run $run_id for pull request #$pr did not finish cancelling; skipping"
                  return 0
                fi
                sleep 10
                waited=$((waited + 10))
                run_status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .status) || return 1
              done
            fi
            gh api "repos/$GITHUB_REPOSITORY/statuses/$sha" -f state=pending \
              -f context="Library dist current" -f description="Re-checking after a library change on the base branch" \
              || return 1
            # A refused re-run (for example, a run older than GitHub's 30-day re-run limit) would leave the
            # status pending with nothing to replace it, so replace it with a failure the author can act on.
            if ! gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/rerun"; then
              echo "::warning::Could not re-run check run $run_id for pull request #$pr; marked it failed"
              gh api "repos/$GITHUB_REPOSITORY/statuses/$sha" -f state=failure \
                -f context="Library dist current" -f description="Could not re-check; push a commit to run the check again" \
                || return 1
            fi
          }

          FAILED=0
          while read -r PR SHA; do
            [ -n "$PR" ] || continue
            if ! recheck "$PR" "$SHA"; then
              echo "::warning::Could not re-check pull request #$PR"
              FAILED=1
            fi
          done <<< "$PULL_REQUESTS"
          exit "$FAILED"
