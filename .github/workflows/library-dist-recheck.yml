name: Library dist recheck

# After a library change lands on a base branch, open library pull requests into it may no longer
# merge into a current dist. Mark them pending so none merges on an old success, then re-check each.
# Runs only base-branch code; it never builds or executes pull request code.
on:
  push:
    branches: ['main', 'release-prep', 'hotfix-*']

concurrency:
  group: library-dist-recheck-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  statuses: write
  actions: write

jobs:
  recheck-open-pull-requests:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - name: Re-check open library pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]; then
            CHANGED=$(git diff --name-only "$BEFORE_SHA" HEAD | node .erb/scripts/library-dist/classify-library-change.ts)
            [ "$CHANGED" = true ] || { echo "No library changes; nothing to re-check"; exit 0; }
          fi
          PULL_REQUESTS=$(gh pr list --base "$GITHUB_REF_NAME" --state open --limit 200 --json number,headRefOid,files \
            | node .erb/scripts/library-dist/select-library-prs.ts)
          FAILED=0
          while read -r PR SHA; do
            [ -n "$PR" ] || continue
            if ! { gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending \
                     -f context="Library dist current" -f description="Re-checking after a library change on the base branch" \
                   && gh workflow run library-dist-check.yml --ref "$GITHUB_REF_NAME" -f pr="$PR"; }; then
              echo "::warning::Could not re-check pull request #$PR"
              FAILED=1
            fi
          done <<< "$PULL_REQUESTS"
          exit "$FAILED"
