name: Library dist check

on:
  pull_request:
    # `edited` covers a change of base branch; other edits are skipped by the job's `if`.
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: ['main', 'release-prep', 'hotfix-*', 'ai/main']
  push:
    branches: ['main', 'release-prep', 'hotfix-*', 'ai/main']

# One run per pull request, and one per pushed commit, so a newer push to a pull request cancels an
# older run but back-to-back pushes to a base branch each keep their own check. An edit that does not
# change the base gets a group of its own, so a title edit never cancels a real check.
concurrency:
  group: library-dist-${{ github.event_name == 'push' && github.sha || (github.event.action == 'edited' && !github.event.changes.base && format('edit-{0}', github.run_id)) || github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    # Builds the pull request's code, so it holds a read-only token. The status is posted by
    # library-dist-report.yml.
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Resolve what to check
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # The target file lives outside the workspace because actions/checkout cleans untracked
          # files there. The `runner` context is unavailable in job-level `env`, so it is set here.
          TARGET_FILE="$RUNNER_TEMP/library-dist/target.json"
          mkdir -p "$(dirname "$TARGET_FILE")"
          echo "TARGET_FILE=$TARGET_FILE" >> "$GITHUB_ENV"
          if [ "$EVENT_NAME" = push ]; then
            echo "pr=" >> "$GITHUB_OUTPUT"
            echo "head_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "base_ref=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "diff_from=$BEFORE_SHA" >> "$GITHUB_OUTPUT"
            printf '{"sha":"%s","attempt":%s,"description":"Checking"}' "$GITHUB_SHA" "$GITHUB_RUN_ATTEMPT" > "$TARGET_FILE"
          else
            PR="$EVENT_PR"
            # Written before the lookup so a failed lookup still uploads a target and the report
            # posts a failure, rather than nothing. The report skips it if the head has moved on.
            printf '{"pr":%s,"sha":"%s","attempt":%s,"description":"Checking"}' "$PR" "$EVENT_HEAD_SHA" "$GITHUB_RUN_ATTEMPT" > "$TARGET_FILE"
            # Looked up at run time, so a re-run checks the pull request's current head and base.
            # One retry covers a transient API error.
            PR_FIELDS='"\(.head.sha) \(.base.ref)"'
            read -r HEAD_SHA BASE_REF < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq "$PR_FIELDS" \
              || { sleep 5; gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq "$PR_FIELDS"; })
            [ -n "$HEAD_SHA" ] && [ -n "$BASE_REF" ] || { echo "Could not look up pull request #$PR"; exit 1; }
            echo "pr=$PR" >> "$GITHUB_OUTPUT"
            echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
            printf '{"pr":%s,"sha":"%s","attempt":%s,"description":"Checking"}' "$PR" "$HEAD_SHA" "$GITHUB_RUN_ATTEMPT" > "$TARGET_FILE"
          fi

      - name: Upload the target early
        uses: actions/upload-artifact@v4
        with:
          name: library-dist-target
          path: ${{ runner.temp }}/library-dist/target.json
          overwrite: true

      # A pull request is checked as merged into its base's current tip; a push is checked at the
      # pushed commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.pr != '' && steps.target.outputs.base_ref || steps.target.outputs.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Merge the pull request into its base
        if: steps.target.outputs.pr != ''
        env:
          PR: ${{ steps.target.outputs.pr }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          BASE_REF: ${{ steps.target.outputs.base_ref }}
        run: |
          git fetch origin "refs/pull/$PR/head"
          git config user.name library-dist-check
          git config user.email library-dist-check@users.noreply.github.com
          if ! git merge --no-ff -m "Simulated merge for the library dist check" "$HEAD_SHA"; then
            node .erb/scripts/library-dist/write-description.ts "Merge conflict with $BASE_REF: merge it into your branch and resolve"
            exit 1
          fi

      - name: Classify the change
        id: classify
        env:
          PR: ${{ steps.target.outputs.pr }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          DIFF_FROM: ${{ steps.target.outputs.diff_from }}
        run: |
          if [ -n "$PR" ]; then
            FILES=$(git diff --name-only "$(git merge-base HEAD^1 "$HEAD_SHA")" "$HEAD_SHA")
          elif [ -z "$DIFF_FROM" ] || [ "$DIFF_FROM" = 0000000000000000000000000000000000000000 ]; then
            FILES=lib/platform-bible-react/
          else
            FILES=$(git diff --name-only "$DIFF_FROM" HEAD)
          fi
          LIBRARY=$(printf '%s\n' "$FILES" | node .erb/scripts/library-dist/classify-library-change.ts)
          [ "$LIBRARY" = true ] || [ "$LIBRARY" = false ] || { echo "Unexpected classification: $LIBRARY"; exit 1; }
          echo "library=$LIBRARY" >> "$GITHUB_OUTPUT"

      - name: No library changes
        if: steps.classify.outputs.library != 'true'
        run: node .erb/scripts/library-dist/write-description.ts "No library changes"

      - name: Install
        if: steps.classify.outputs.library == 'true'
        run: npm ci

      - name: Rebuild and compare dist
        if: steps.classify.outputs.library == 'true'
        run: |
          if npm run verify:library-dist; then
            node .erb/scripts/library-dist/write-description.ts "dist matches a fresh build"
          else
            node .erb/scripts/library-dist/write-description.ts "dist is stale: run npm run build:pbu and build:pbr, commit"
            exit 1
          fi

      - name: Smoke-load dist
        if: steps.classify.outputs.library == 'true'
        run: |
          npm run verify:library-dist-load || {
            node .erb/scripts/library-dist/write-description.ts "dist fails to load; see the run log"
            exit 1
          }

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-dist-target
          path: ${{ runner.temp }}/library-dist/target.json
          overwrite: true
