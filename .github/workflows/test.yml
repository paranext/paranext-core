name: Test

# Make sure these match with the matrix.os values below
env:
  OS_WINDOWS: windows-latest
  OS_MACOS: macos-15
  # The Ubuntu version must align with the "core" version in electron-builder.json5
  OS_LINUX: ubuntu-22.04

on:
  push:
    branches: ['main', 'release-prep', 'hotfix-*', 'ai/main']
  pull_request:
    # The branches below should be a subset of the branches above
    branches: ['main', 'release-prep', 'hotfix-*', 'ai/main']
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false

jobs:
  test:
    name: Build on ${{ matrix.os }}, .Net ${{ matrix.dotnet_version }}

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # Make sure these match with the env values above
        os: [windows-latest, macos-15, ubuntu-22.04]
        dotnet_version: [8.0.x]

    steps:
      - name: Install MacPorts
        if: ${{ matrix.os == env.OS_MACOS }}
        uses: paranext/setup-macports@v0.2.0

      - name: Update MacPorts ports tree
        if: ${{ matrix.os == env.OS_MACOS }}
        # Not using `-v` for verbose because it is very slow and does not add much value
        run: |
          sudo port sync

      - name: Install loader tools on macOS
        if: ${{ matrix.os == env.OS_MACOS }}
        run: |
          sudo port -v install ld64

      - name: Install icu4c on macOS
        if: ${{ matrix.os == env.OS_MACOS }}
        run: |
          sudo port -v install icu @78.3_1 +universal

      - name: Fixup loader paths for icu4c
        if: ${{ matrix.os == env.OS_MACOS }}
        # LIB_DEPENDENCIES are of the form "<ICU lib short name> <dependency as ICU lib short name>"
        # For example, libicuuc (shortened to "uc") depends on libicudata (shortened to "data")
        # Dependencies can be seen by running "dyld_info -dependents /path/to/something.dylib"
        run: |
          ICU_VERSION=78
          LIB_DEPENDENCIES="
          i18n data
          i18n uc
          io data
          io i18n
          io uc
          uc data
          "
          LIB_DEPENDENCIES=$(echo "$LIB_DEPENDENCIES" | sed '/^$/d')
          while IFS= read -r line; do
            set -- $line
            sudo install_name_tool -change "/opt/local/lib/libicu$2.$ICU_VERSION.dylib" "@loader_path/libicu$2.$ICU_VERSION.dylib" "/opt/local/lib/libicu$1.$ICU_VERSION.dylib"
          done <<< "$LIB_DEPENDENCIES"

      - name: Ensure macports user exists
        if: ${{ matrix.os == env.OS_MACOS }}
        run: |
          sudo dscl . -create /Users/macports
          sudo dscl . -create /Users/macports UserShell /bin/bash
          sudo dscl . -create /Users/macports RealName "MacPorts User"
          sudo dscl . -create /Users/macports UniqueID 550
          sudo dscl . -create /Users/macports PrimaryGroupID 20
          sudo dscl . -create /Users/macports NFSHomeDirectory /opt/local/var/macports/home
          sudo mkdir -p /opt/local/var/macports/home
          sudo chown macports:staff /opt/local/var/macports/home

      - name: Install snap tools on Linux
        if: ${{ matrix.os == env.OS_LINUX }}
        run: |
          sudo apt update
          sudo apt install -y snapd
          # Pin snapcraft to the 8.x track. snapcraft 9 (now latest/stable) removed the
          # deprecated `snap` command alias, which electron-builder 26.x still invokes,
          # breaking the snap build. Remove this pin once we move to electron-builder >= 27
          # (which calls `snapcraft pack`). See electron-builder issue #8880 / PR #9517.
          sudo snap install snapcraft --classic --channel=8.x/stable
          sudo snap install lxd
          sudo snap refresh lxd
          sudo lxd init --auto
          # Add the current user to the lxd group
          getent group lxd | grep -qwF "$USER" || sudo usermod -aG lxd "$USER"
          newgrp lxd
          # Force the socket to be usable by the current user
          sudo chmod 666 /var/snap/lxd/common/lxd/unix.socket
          # https://github.com/canonical/action-build/blob/master/src/tools.ts#L54
          sudo iptables -P FORWARD ACCEPT

      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet_version }}

      # The notices generator restores the .NET closure once per runtime identifier - four passes,
      # against an internal SIL feed - on top of the build's own restore. `~/.npm` is cached by
      # setup-node and the bundler gems by setup-ruby; this was the one dependency store fetched
      # cold on every run.
      #
      # The key names the files that actually decide what gets restored. `packages.lock.json` is not
      # one of them - this repository uses no NuGet lock files, so that pattern hashed nothing and
      # contributed nothing to the key. `Directory.Build.props` carries shared package versions, and
      # `.config/dotnet-tools.json` pins `nuget-license`, which `dotnet tool restore` fetches into
      # the same store: without it a tool-version bump reuses a cache that predates it.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props',
            '.config/dotnet-tools.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Read package.json
        id: package_json
        uses: zoexx/github-action-json-file-properties@1.0.6
        with:
          file_path: 'package.json'

      - name: Install Volta and toolchain
        uses: volta-cli/action@v4

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: ${{ fromJson(steps.package_json.outputs.volta).node }}
          cache: npm

      # licensee (Ruby) identifies license texts for the third-party notices generator. Linux only:
      # the generator writes the artifact only on Linux, and the other legs verify against the
      # committed lock, which needs no Ruby.
      - name: Install Ruby
        if: ${{ matrix.os == env.OS_LINUX }}
        uses: ruby/setup-ruby@v1
        with:
          # Pinned to match the developer prerequisite. licensee 10.x requires >= 3.2, and letting
          # CI float to a newer Ruby than developers run invites a version of the matcher resolving
          # differently in the two places - which would show up as unexplained verdict churn.
          ruby-version: '3.4'
          bundler-cache: true

      - name: Install packages
        run: npm ci

      # build:main has to run before typecheck as it creates buildInfo.json which typecheck requires
      - name: type checking
        if: ${{ matrix.os == env.OS_LINUX }}
        run: |
          npm run build:main
          npm run typecheck

      - name: Build
        run: npm run build

      # `npm run build` compiles main, renderer and extension-host with NODE_ENV=production but
      # leaves its extensions leg in DEVELOPMENT mode, and every job that packages an installer
      # (publish.yml, package-main.yml, `npm run package`) follows it with this step. The notices
      # document has to be verified against the graph the installers carry, not the one that is
      # thrown away - so this leg builds them the same way before checking anything. Without it the
      # committed document was byte-verified here against a development graph and packaged from a
      # production one, with equality between the two asserted only by a comment.
      #
      # `collectShippedPackages` now refuses a manifest set that mixes modes, so a job that forgets
      # this step fails naming the mismatch rather than describing the wrong graph.
      - name: Build extensions for production
        run: npm run build:extensions:production

      # The whole notices gate for this repository, in ONE pass. It derives the shipping set, runs
      # `classify` over it (so the strong-copyleft gate runs on every pull request), diffs the
      # derived set against THIRD-PARTY-NOTICES.lock.json - which records each package's licensee
      # version, matched file, SPDX id and TEXT HASH, and is the only thing that reports a licence
      # text CHANGING under an unchanged name@version - and compares the rendered document byte for
      # byte against the committed one, which IS the staleness check. A legitimate dependency bump
      # fails here with a diff naming the package and the file, which a human reads and
      # acknowledges by regenerating.
      #
      # Regenerating in CI as well used to follow this step, and it repeated the entire pipeline -
      # `dotnet tool restore`, four `dotnet restore` passes, four `nuget-license` runs and a full
      # licensee batch - to produce bytes this step has already established are identical. It could
      # only ever run when this one passed, so it asserted nothing this one had not.
      #
      # Linux only: the NuGet section is read from the restore closure, which is RID-dependent, so
      # exactly one platform has to be canonical or the three legs would each produce a different
      # file. It needs Ruby and the dotnet restore that `npm run build` above performs.
      - name: verify third-party notices against the committed lock
        if: ${{ matrix.os == env.OS_LINUX }}
        run: npm run verify:third-party-notices

      # The notices file is packaged into every platform's installer, so a Linux-generated
      # artifact is a claim carried by Windows and macOS binaries too. The full check (`--verify`,
      # available via `npm run verify:third-party-notices`) cannot run on these legs: licence
      # identification needs Ruby, installed on the Linux leg only, and the NuGet closure needs four
      # `dotnet restore` passes against an internal SIL feed. Neither of those varies by platform, so
      # re-running them here would only repeat the Linux leg's answer at a cost this leg cannot pay.
      # Licence identification is platform-invariant (same files, same pinned licensee version) and
      # the NuGet closure is already made platform-complete FROM Linux by the four-RID union.
      # The one thing that genuinely varies is the npm closure - npm installs an optional dependency
      # only where its os/cpu constraints match - so that is the one thing this leg checks: its own
      # resolved npm packages, by name@version, against the committed lock's npm entries. No Ruby, no
      # dotnet, no network. See `adr-notices-derived-from-what-ships`.
      - name: verify npm shipping set matches this platform
        if: ${{ matrix.os != env.OS_LINUX }}
        run: npm run verify:third-party-notices:shipping-set

      - name: Verify no files changed after build
        id: verify-changed-files
        uses: tj-actions/verify-changed-files@v20

      - name: Report file changes
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        # This step runs on all three legs, and `case`/`esac` is POSIX shell: without this the
        # windows leg runs it under pwsh, where it is a parse error - the leg still fails, but the
        # list of changed files it exists to print is lost, which is the only thing it does.
        shell: bash
        env:
          CHANGED_FILES: ${{ steps.verify-changed-files.outputs.changed_files }}
        run: |
          echo "Error - changed files after build: $CHANGED_FILES"
          # THIRD-PARTY-NOTICES.md is the one build output whose remedy is not "run the build":
          # regenerating it needs a Linux machine with a full `dotnet restore` and a complete
          # node_modules, which is why a dependency-version bump lands here rather than at review.
          # The lock is matched too: it is written as the document's pair, and a run that rewrites
          # only the lock (a licence text changing under an unchanged name@version) would otherwise
          # print the generic message and none of the remedy.
          case "$CHANGED_FILES" in
            *THIRD-PARTY-NOTICES*)
              echo
              echo "THIRD-PARTY-NOTICES.md is out of date. It is generated, never edited by hand."
              echo "On Linux, with dependencies installed:"
              echo
              echo "    dotnet restore c-sharp/ParanextDataProvider.csproj"
              echo "    npm run build:third-party-notices"
              echo
              echo "Then commit BOTH regenerated files - THIRD-PARTY-NOTICES.md and"
              echo "THIRD-PARTY-NOTICES.lock.json are written as a pair. A dependency version"
              echo "change - npm or NuGet, including the ParatextData/ParatextChecks pins in"
              echo "c-sharp/ParanextDataProvider.csproj - always changes them."
              ;;
          esac
          exit 1

      - name: dotnet unit tests
        run: dotnet test c-sharp-tests/c-sharp-tests.csproj

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: npm unit tests
        run: npm test

      # No --server-args, so this runs at Xvfb's 1280x1024x8 default. Fine here: the smoke
      # suite launches its own Electron and does not use cdp.fixture. A cdp.fixture-based job
      # cannot be added by putting --server-args on this step — that fixture attaches over port
      # 9223 to an app started elsewhere, so this xvfb-run would never govern that app's window.
      # Such a job has to start the app and Playwright under one Xvfb at 1920x1080x24, which is
      # what fixtures/cdp.fixture.ts requires for screenshots.
      - name: E2E tests (Linux)
        if: ${{ matrix.os == env.OS_LINUX }}
        run: xvfb-run --auto-servernum npm run test:e2e:smoke

      # Non-blocking on Windows AND macOS: the smoke suite is chronically flaky on the
      # smaller macOS runners (extension host fails to start under load; see #2336,
      # #2338, #2357 for failed timeout-based fixes), and Windows has occasional E2E
      # flakes of its own (e.g. the theme-toggle failure on 2026-06-12). Linux remains
      # blocking; it passed every run in the prior 30 days. Failures still upload
      # Playwright artifacts below and surface as a warning annotation.
      # Remove continue-on-error once the macOS startup failure is resolved.
      - name: E2E tests (Windows/macOS)
        id: e2e-win-mac
        if: ${{ matrix.os != env.OS_LINUX }}
        continue-on-error: true
        run: npm run test:e2e:smoke

      - name: Warn on non-blocking E2E failure (Windows/macOS)
        if: ${{ steps.e2e-win-mac.outcome == 'failure' }}
        run: echo "::warning title=E2E smoke tests failed (non-blocking)::E2E smoke tests failed on ${{ matrix.os }} but did not fail the build. See the playwright-results-${{ matrix.os }} artifact."

      - name: Upload Playwright test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.os }}
          retention-days: 7
          path: |
            e2e-tests/test-results/
            e2e-tests/playwright-report/
          if-no-files-found: ignore

      - name: check dotnet formatting
        if: ${{ matrix.os == env.OS_LINUX }}
        run: |
          cd c-sharp
          dotnet tool restore
          dotnet csharpier --check .

      - name: check JS/TS formatting
        if: ${{ matrix.os == env.OS_LINUX }}
        run: npm run format:check

      - name: check JS/TS linting
        if: ${{ matrix.os == env.OS_LINUX }}
        run: npm run lint

      - name: check packaging
        env:
          # no hardlinks so dependencies are copied
          USE_HARD_LINKS: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run package

      - name: Delete previous Windows artifacts created by this workflow
        if: ${{ matrix.os == env.OS_WINDOWS }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (gh api -X GET /repos/${{ github.repository }}/actions/artifacts --jq '.artifacts[] | select(.name == "app-windows-test" and .workflow_run.head_branch == "${{ github.ref_name }}") | .id') -split "`n" | ForEach-Object { gh api -X DELETE /repos/${{ github.repository }}/actions/artifacts/$_ }

      - name: Rename Windows exe to include GitHub Action Run ID
        if: ${{ matrix.os == env.OS_WINDOWS }}
        run: |
          Get-ChildItem -Path ./release/build/*.exe | ForEach-Object {
            if (-not ($_.Name -like "*Setup*.exe")) {
              $newName = "$($_.BaseName)-${{ github.run_id }}.exe"
              Rename-Item -Path $_.FullName -NewName $newName
              Write-Host "Renamed $($_.Name) to $newName"
            }
          }

      - name: Upload Windows artifacts
        if: ${{ matrix.os == env.OS_WINDOWS }}
        uses: actions/upload-artifact@v4
        with:
          name: app-windows-test
          retention-days: 14
          path: |
            ./release/build/*.exe
            !./release/build/*Setup*.exe

      - name: Delete previous macOS artifacts created by this workflow
        if: ${{ matrix.os == env.OS_MACOS }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X GET /repos/${{ github.repository }}/actions/artifacts --jq '.artifacts[] | select(.name == "app-macos-test" and .workflow_run.head_branch == "${{ github.ref_name }}") | .id' | xargs -I {} gh api -X DELETE /repos/${{ github.repository }}/actions/artifacts/{}

      - name: Rename macOS dmg to include GitHub Action Run ID
        if: ${{ matrix.os == env.OS_MACOS }}
        run: |
          for file in ./release/build/*.dmg; do
            newName="${file%.dmg}-${{ github.run_id }}.dmg"
            mv "$file" "$newName"
            echo "Renamed $file to $newName"
          done

      - name: Upload macOS artifacts
        if: ${{ matrix.os == env.OS_MACOS }}
        uses: actions/upload-artifact@v4
        with:
          name: app-macos-test
          retention-days: 14
          path: |
            ./release/build/*.dmg

      - name: Delete previous Linux artifacts created by this workflow
        if: ${{ matrix.os == env.OS_LINUX }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X GET /repos/${{ github.repository }}/actions/artifacts --jq '.artifacts[] | select(.name == "app-linux-test" and .workflow_run.head_branch == "${{ github.ref_name }}") | .id' | xargs -I {} gh api -X DELETE /repos/${{ github.repository }}/actions/artifacts/{}

      - name: Rename Linux snap to include GitHub Action Run ID
        if: ${{ matrix.os == env.OS_LINUX }}
        run: |
          for file in ./release/build/*.snap; do
            newName="${file%.snap}-${{ github.run_id }}.snap"
            mv "$file" "$newName"
            echo "Renamed $file to $newName"
          done

      - name: Upload Linux artifacts
        if: ${{ matrix.os == env.OS_LINUX }}
        uses: actions/upload-artifact@v4
        with:
          name: app-linux-test
          retention-days: 14
          path: |
            ./release/build/*.snap

      # Enable tmate debugging of manually-triggered workflows if the input option was provided
      - name: Setup tmate session
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
