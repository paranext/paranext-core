name: Library dist report

on:
  workflow_run:
    workflows: ['Library dist check']
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write

jobs:
  report:
    # A cancelled run was superseded by a newer one for the same pull request, which reports instead.
    # A skipped run is a pull request edit that did not change the base, so there is nothing to report.
    if: github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-22.04
    steps:
      # Runs only this repository's default-branch code; the artifact is untrusted data.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .erb/scripts/library-dist
            package.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - uses: actions/download-artifact@v4
        with:
          name: library-dist-target
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: result
        continue-on-error: true
      - name: Post the status
        env:
          TARGET_FILE: result/target.json
          EVENT: ${{ github.event.workflow_run.event }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .erb/scripts/library-dist/report-library-dist.ts
