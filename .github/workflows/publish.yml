name: Publish
run-name: Publish release v${{ github.event.inputs.version }} on ${{ github.head_ref || github.ref_name }}

# Every step that calls a remote service gets `timeout-minutes: 90`: above the slowest successful
# run on record, so a slow service still passes, but a stall fails with its diagnostics. The job's
# 180-minute cap only catches what the step caps miss; a job timeout cancels, skipping diagnostics.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish. For verification purposes only; if the package.json version is different on the specified branch, the workflow will fail.'
        required: true
      newVersionAfterPublishing:
        description: "Version to bump all the repo's versions to on a new branch (called `bump-versions-<version>`) after making a new release, e.g. 0.3.0-alpha.0. If empty, will not bump the versions."
        required: false
      bumpRef:
        description: 'Git ref to create the new `bump-versions-<version>` branch from. If empty, will use the current branch.'
        required: false
      uploadReleaseAssets:
        description: 'Upload the release assets to the configured S3 bucket.'
        type: boolean
        required: false
        default: false
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false

jobs:
  publish:
    name: Release on ${{ matrix.os }}

    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    permissions:
      contents: write

    strategy:
      matrix:
        # Steps pick their OS with `runner.os`, so changing a runner label here is the whole change.
        os:
          - windows-latest
          # Move with the `||` defaults in test.yml and package-main.yml. Pinned because newer macOS
          # images are often slow to get a runner.
          - macos-15
          # The Ubuntu version must align with the "core" version in electron-builder.json5
          - ubuntu-22.04

    steps:
      - name: Output Workflow Dispatch Inputs
        run: echo "${{ toJSON(github.event.inputs) }}"

      - name: Install MacPorts
        if: ${{ runner.os == 'macOS' }}
        timeout-minutes: 90
        uses: paranext/setup-macports@v0.3.0

      - name: Install loader tools on macOS
        if: ${{ runner.os == 'macOS' }}
        timeout-minutes: 90
        run: |
          sudo port -v install ld64

      - name: Install icu4c on macOS
        if: ${{ runner.os == 'macOS' }}
        timeout-minutes: 90
        run: |
          sudo port -v install icu @78.3_1 +universal

      - name: Fixup loader paths for icu4c
        if: ${{ runner.os == 'macOS' }}
        # LIB_DEPENDENCIES are of the form "<ICU lib short name> <dependency as ICU lib short name>"
        # For example, libicuuc (shortened to "uc") depends on libicudata (shortened to "data")
        # Dependencies can be seen by running "dyld_info -dependents /path/to/something.dylib"
        run: |
          ICU_VERSION=78
          LIB_DEPENDENCIES="
          i18n data
          i18n uc
          io data
          io i18n
          io uc
          uc data
          "
          LIB_DEPENDENCIES=$(echo "$LIB_DEPENDENCIES" | sed '/^$/d')
          while IFS= read -r line; do
            set -- $line
            sudo install_name_tool -change "/opt/local/lib/libicu$2.$ICU_VERSION.dylib" "@loader_path/libicu$2.$ICU_VERSION.dylib" "/opt/local/lib/libicu$1.$ICU_VERSION.dylib"
          done <<< "$LIB_DEPENDENCIES"

      - name: Install snap tools on Linux
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 90
        run: |
          # apt is safe to kill mid-download; snap is not (snapd keeps the change running), so only
          # apt gets a per-command bound.
          timeout 10m sudo apt update
          timeout 10m sudo apt install -y snapd
          # The snap store CDN intermittently answers a download with a 502 and snapd
          # gives up on the first try, failing the job before the build even starts.
          retry() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              echo "WARNING: '$*' failed (attempt $attempt of 3); retrying in 30s"
              sleep 30
            done
            echo "ERROR: '$*' failed after 3 attempts"
            return 1
          }
          # Hold snapd's automatic refreshes for the job. snapd refreshes installed snaps
          # on its own schedule; refreshing `lxd` (or `core*`/`snapd` under it) while
          # snapcraft is packing inside an LXD instance restarts the daemon out from under
          # the running build. Explicit `snap install`/`refresh` below still work while
          # held. Best-effort: a snapd that rejects the option must not fail the build.
          sudo snap set system refresh.hold="$(date -u -d '+1 day' +%Y-%m-%dT%H:%M:%SZ)" ||
            echo "WARNING: could not hold snapd auto-refresh; a refresh may disrupt the snap build"
          # Pin snapcraft to the 8.x track. snapcraft 9 (now latest/stable) removed the
          # deprecated `snap` command alias, which electron-builder 26.x still invokes,
          # breaking the snap build. Remove this pin once we move to electron-builder >= 27
          # (which calls `snapcraft pack`). See electron-builder issue #8880 / PR #9517.
          retry sudo snap install snapcraft --classic --channel=8.x/stable
          retry sudo snap install lxd
          retry sudo snap refresh lxd
          sudo lxd init --auto
          # Add the current user to the lxd group. (No `newgrp lxd` here: in a script it
          # execs a *child* shell that reads EOF from stdin and exits immediately, so it
          # never changes this shell's groups -- the `chmod` below is what does the work.)
          getent group lxd | grep -qwF "$USER" || sudo usermod -aG lxd "$USER"
          # Force the socket to be usable by the current user
          sudo chmod 666 /var/snap/lxd/common/lxd/unix.socket
          # https://github.com/canonical/action-build/blob/master/src/tools.ts#L54
          sudo iptables -P FORWARD ACCEPT

      - name: Checkout git repo
        timeout-minutes: 90
        uses: actions/checkout@v4

      - name: Install .NET
        timeout-minutes: 90
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Read package.json
        id: package_json
        uses: zoexx/github-action-json-file-properties@1.0.6
        with:
          file_path: 'package.json'

      - name: Read release/app/package.json
        id: release_package_json
        uses: zoexx/github-action-json-file-properties@1.0.6
        with:
          file_path: 'release/app/package.json'

      - name: Verify version (skips if versions match)
        if: '${{ inputs.version != steps.release_package_json.outputs.version }}'
        run: |
          echo "Version mismatch! Expected ${{ inputs.version }} but found ${{ steps.release_package_json.outputs.version }}"
          exit 1

      - name: Install Volta and toolchain
        timeout-minutes: 90
        uses: volta-cli/action@v4

      - name: Install Node and NPM
        timeout-minutes: 90
        uses: actions/setup-node@v4
        with:
          node-version: ${{ fromJson(steps.package_json.outputs.volta).node }}
          cache: npm

      - name: Install packages and build
        timeout-minutes: 90
        run: |
          npm ci
          npm run build

      # `npm run build` builds the extensions in DEVELOPMENT mode: its extensions leg sets no
      # NODE_ENV, and `extensions/webpack/webpack.config.base.ts` reads `mode` from it. electron-
      # builder copies `extensions/dist/` into the artifact as it finds it, so without this step the
      # installers this job uploads carry unminified extension bundles with inline source maps,
      # while `npm run package` produces production ones from the same commit.
      - name: Build extensions for production
        run: npm run build:extensions:production

      # THIRD-PARTY-NOTICES.md is packaged into every installer this job produces, so a release cut
      # from a ref whose Linux test.yml leg never ran green would ship a stale legal document with
      # nothing to say so. The full check needs Ruby and four dotnet restores and cannot run here;
      # this is the cheap cross-platform half - this platform's resolved npm shipping set against
      # the committed lock the document was generated from. No Ruby, no dotnet, no network.
      #
      # AFTER the production extension build, so it reads the manifests of the graph this job
      # actually packages rather than the development one it built first. Those manifests have to
      # come from a COLD webpack cache - a module restored from cache does not re-run its loaders,
      # so a manifest written over a warm one can be short (see `isWarmFilesystemCache`). Each
      # extension bundle caches per bundle AND per mode (`extensionCacheDirectory`), which is what
      # makes the production build above the first to touch its own directories and therefore
      # genuinely cold; without that split, running this step here would read two warm manifests.
      - name: Verify third-party notices describe what this build ships
        run: npm run verify:third-party-notices:shipping-set

      - name: Prepare release - Windows
        if: ${{ runner.os == 'Windows' }}
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --publish never --win
          mkdir release\\staged
          move release\\build\\*Setup*.exe release\\staged

      - name: Code signing - Windows
        if: ${{ runner.os == 'Windows' }}
        timeout-minutes: 90
        # See https://github.com/cognitedata/code-sign-action/blob/a29458b69495966f90920f07aeed5acfe03e1f45/README.md
        # for descriptions. This step receives the signing secrets, so the action is pinned to a
        # reviewed commit rather than a tag its owner could move. Review the new code before bumping.
        env:
          CERTIFICATE_HOST: ${{ secrets.WIN_CODE_SIGNING_CERT_HOST }}
          CERTIFICATE_HOST_API_KEY: ${{ secrets.WIN_CODE_SIGNING_CERT_HOST_API_KEY }}
          CLIENT_CERTIFICATE: ${{ secrets.WIN_CODE_SIGNING_CLIENT_CERT }}
          CLIENT_CERTIFICATE_PASSWORD: ${{ secrets.WIN_CODE_SIGNING_CLIENT_CERT_PASSWORD }}
          KEYPAIR_ALIAS: ${{ secrets.WIN_CODE_SIGNING_KEYPAIR_ALIAS }}
        uses: cognitedata/code-sign-action@a29458b69495966f90920f07aeed5acfe03e1f45 # v5
        with:
          path-to-binary: 'release\\staged'

      - name: Prepare release - macOS
        if: ${{ runner.os == 'macOS' }}
        timeout-minutes: 90
        env:
          # The APPLE_* values are used for auto updates signing
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # This is used for uploading release assets to github
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --publish never --mac
          mkdir release/staged
          mv release/build/*.dmg release/staged

      # Builds the Linux installer and publishes it nowhere. This repository does not distribute a
      # built application (see LICENSING.md, "The distributed application"); Paratext 10 is released
      # from `paranext/paratext-10-studio`. The build still runs on every release so that a broken
      # Linux packaging path surfaces while the release is being cut rather than afterward.
      #
      # No `release/staged` step, unlike Windows and macOS: staging exists to feed the S3 upload
      # below, and that step excludes Linux. Internal Linux builds come from `package-main.yml`,
      # which uploads a per-platform artifact on every push.
      - name: Prepare release - Linux
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 90
        env:
          # no hardlinks so dependencies are copied
          USE_HARD_LINKS: false
          # This is used by electron-builder to prepare the release
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --publish never --linux
          # In the same block rather than a following step: a broken snap should fail the release
          # build here, before anything downstream treats it as a good one.
          npm run assert:snap-metadata

      # The Linux failures worth debugging leave their evidence outside the build's own
      # output: snapcraft's log holds the real mksquashfs error rather than the bare
      # "mksquashfs call failed:" that reaches the console, and if the kernel ever kills
      # the build for memory it names the process it chose only in dmesg.
      - name: Capture Linux failure diagnostics
        if: ${{ failure() && runner.os == 'Linux' }}
        run: |
          echo "=== kernel OOM activity ==="
          sudo dmesg --ctime 2>/dev/null | grep -iE "out of memory|oom-kill|killed process" || echo "(no OOM entries in dmesg)"
          echo "=== kernel log tail ==="
          sudo dmesg --ctime 2>/dev/null | tail -40 || true
          echo "=== memory ==="; free -h; swapon --show || true
          echo "=== disk ==="; df -h /
          echo "=== processes (a timed-out step leaves its children running) ==="
          ps -eo pid,etime,rss,args --sort=-rss | head -25

      - name: Upload snapcraft logs (Linux)
        if: ${{ failure() && runner.os == 'Linux' }}
        timeout-minutes: 90
        uses: actions/upload-artifact@v4
        with:
          name: snapcraft-logs
          path: |
            ~/.local/state/snapcraft/log/
          if-no-files-found: warn

      # Creates the tag, the draft and the generated notes, and attaches NO binaries. The release is
      # a fixed point in Git history for the Paratext 10 build to construct its own releases
      # from, not a download (see LICENSING.md, "The distributed application"). `artifacts` is an
      # optional input, so omitting it leaves everything else about the release intact.
      #
      # One leg only: with no per-platform asset to contribute, running on all three would race three
      # jobs to create the same release.
      - name: Publish draft release
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 90
        uses: ncipollo/release-action@v1
        with:
          # Need to allow updates in order to re-run this workflow against an existing draft
          allowUpdates: true
          bodyFile: .github/assets/release-body.md
          # make the new release a draft instead of automatically publishing
          draft: true
          generateReleaseNotes: true
          # if the release already exists, leave its metadata alone
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          # make the new release a pre-release
          prerelease: true
          # tag+commit creates a version tag for this release with the tag name at the commit ref
          # so the GitHub Release doesn't have to create the tag and assume it is on `main`
          tag: v${{ inputs.version }}
          commit: ${{ github.head_ref || github.ref_name }}
          # only update if the release is still a draft
          updateOnlyUnreleased: true

      - name: Upload release assets to S3
        if: ${{ inputs.uploadReleaseAssets && runner.os != 'Linux' }}
        timeout-minutes: 90
        # The AWS CLI is preinstalled on GitHub-hosted runners, so the S3 keys reach no third-party
        # action. Objects must be public-read: the installers are downloaded anonymously.
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_S3_RELEASE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_S3_RELEASE_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ vars.AWS_S3_RELEASE_BUCKET_NAME }}
          S3_DIRECTORY: ${{ vars.AWS_S3_RELEASE_DIRECTORY }}
          RELEASE_VERSION: ${{ inputs.version }}
        # RUNNER_OS is Windows or macOS
        run: |
          set -euo pipefail
          aws s3 cp release/staged "s3://$S3_BUCKET/$S3_DIRECTORY/$RELEASE_VERSION/$RUNNER_OS/" \
            --recursive --acl public-read --no-progress

      - name: Checkout bump ref
        if: ${{ runner.os == 'Linux' && inputs.newVersionAfterPublishing != '' && inputs.bumpRef != '' && inputs.bumpRef != (github.head_ref || github.ref_name) }}
        timeout-minutes: 90
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ inputs.bumpRef }}

      # The bump ends in a `git commit`, which runs this repo's husky pre-commit hook. That hook
      # requires gitleaks on PATH and blocks the commit without it (see README "Install gitleaks"),
      # and gitleaks is not part of the runner image.
      - name: Install gitleaks for the pre-commit hook
        if: ${{ runner.os == 'Linux' && inputs.newVersionAfterPublishing != '' }}
        timeout-minutes: 90
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gitleaks" version

      - name: Bump repo versions
        if: ${{ runner.os == 'Linux' && inputs.newVersionAfterPublishing != '' }}
        timeout-minutes: 90
        uses: ./.github/actions/bump-versions-action
        with:
          newVersion: ${{ inputs.newVersionAfterPublishing }}

      # Enable tmate debugging of manually-triggered workflows if the input option was provided
      - name: Setup tmate session
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
