name: Package

# Make sure these match with the matrix.os values below
env:
  OS_WINDOWS: windows-latest
  OS_MACOS: macos-15
  # The Ubuntu version must align with the "core" version in electron-builder.json5
  OS_LINUX: ubuntu-22.04

on:
  push:
    branches: [main, release-prep, hotfix-*, ai/main]
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false

jobs:
  publish:
    name: Main on ${{ matrix.os }}, .Net ${{ matrix.dotnet_version }}

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # Make sure these match with the env values above
        os: [windows-latest, macos-15, ubuntu-22.04]
        dotnet_version: [8.0.x]

    steps:
      - name: Install MacPorts
        if: ${{ matrix.os == env.OS_MACOS }}
        uses: paranext/setup-macports@v0.2.0

      - name: Update MacPorts ports tree
        if: ${{ matrix.os == env.OS_MACOS }}
        # Not using `-v` for verbose because it is very slow and does not add much value
        run: |
          sudo port sync

      - name: Install loader tools on macOS
        if: ${{ matrix.os == env.OS_MACOS }}
        run: |
          sudo port -v install ld64

      - name: Install icu4c on macOS
        if: ${{ matrix.os == env.OS_MACOS }}
        run: |
          sudo port -v install icu @78.3_1 +universal

      - name: Fixup loader paths for icu4c
        if: ${{ matrix.os == env.OS_MACOS }}
        # LIB_DEPENDENCIES are of the form "<ICU lib short name> <dependency as ICU lib short name>"
        # For example, libicuuc (shortened to "uc") depends on libicudata (shortened to "data")
        # Dependencies can be seen by running "dyld_info -dependents /path/to/something.dylib"
        run: |
          ICU_VERSION=78
          LIB_DEPENDENCIES="
          i18n data
          i18n uc
          io data
          io i18n
          io uc
          uc data
          "
          LIB_DEPENDENCIES=$(echo "$LIB_DEPENDENCIES" | sed '/^$/d')
          while IFS= read -r line; do
            set -- $line
            sudo install_name_tool -change "/opt/local/lib/libicu$2.$ICU_VERSION.dylib" "@loader_path/libicu$2.$ICU_VERSION.dylib" "/opt/local/lib/libicu$1.$ICU_VERSION.dylib"
          done <<< "$LIB_DEPENDENCIES"

      - name: Install snap tools on Linux
        if: ${{ matrix.os == env.OS_LINUX }}
        run: |
          sudo apt update
          sudo apt install -y snapd
          # The snap store CDN intermittently answers a download with a 502 and snapd
          # gives up on the first try, failing the job before the build even starts.
          retry() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              echo "WARNING: '$*' failed (attempt $attempt of 3); retrying in 30s"
              sleep 30
            done
            echo "ERROR: '$*' failed after 3 attempts"
            return 1
          }
          # Hold snapd's automatic refreshes for the job. snapd refreshes installed snaps
          # on its own schedule; refreshing `lxd` (or `core*`/`snapd` under it) while
          # snapcraft is packing inside an LXD instance restarts the daemon out from under
          # the running build. Explicit `snap install`/`refresh` below still work while
          # held. Best-effort: a snapd that rejects the option must not fail the build.
          sudo snap set system refresh.hold="$(date -u -d '+1 day' +%Y-%m-%dT%H:%M:%SZ)" ||
            echo "WARNING: could not hold snapd auto-refresh; a refresh may disrupt the snap build"
          # Pin snapcraft to the 8.x track. snapcraft 9 (now latest/stable) removed the
          # deprecated `snap` command alias, which electron-builder 26.x still invokes,
          # breaking the snap build. Remove this pin once we move to electron-builder >= 27
          # (which calls `snapcraft pack`). See electron-builder issue #8880 / PR #9517.
          retry sudo snap install snapcraft --classic --channel=8.x/stable
          retry sudo snap install lxd
          retry sudo snap refresh lxd
          sudo lxd init --auto
          # Add the current user to the lxd group. (No `newgrp lxd` here: in a script it
          # execs a *child* shell that reads EOF from stdin and exits immediately, so it
          # never changes this shell's groups -- the `chmod` below is what does the work.)
          getent group lxd | grep -qwF "$USER" || sudo usermod -aG lxd "$USER"
          # Force the socket to be usable by the current user
          sudo chmod 666 /var/snap/lxd/common/lxd/unix.socket
          # https://github.com/canonical/action-build/blob/master/src/tools.ts#L54
          sudo iptables -P FORWARD ACCEPT

      - name: Checkout git repo
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet_version }}

      - name: Read package.json
        id: package_json
        uses: zoexx/github-action-json-file-properties@1.0.6
        with:
          file_path: 'package.json'

      - name: Install Volta and toolchain
        uses: volta-cli/action@v4

      - name: Install Node and NPM
        uses: actions/setup-node@v4
        with:
          node-version: ${{ fromJson(steps.package_json.outputs.volta).node }}
          cache: npm

      - name: Install packages and build
        run: |
          npm ci
          npm run build

      # See the matching step in publish.yml: `npm run build` builds the extensions in development
      # mode, and electron-builder packs `extensions/dist/` as it finds it.
      - name: Build extensions for production
        run: npm run build:extensions:production

      # See the matching step in publish.yml: the notices document is packaged into every artifact
      # this job produces, and this is the cross-platform half of the check that it describes what
      # is being packaged. It runs AFTER the production extension build so it reads the manifests of
      # the graph this job packages; each extension bundle caches per bundle and per mode
      # (`extensionCacheDirectory`), so that build is cold and its manifests can be trusted.
      - name: Verify third-party notices describe what this build ships
        run: npm run verify:third-party-notices:shipping-set

      - name: Publish releases - Windows
        if: ${{ matrix.os == env.OS_WINDOWS }}
        run: |
          npx electron-builder build --publish never --win

      - name: Publish releases - macOS
        if: ${{ matrix.os == env.OS_MACOS }}
        run: |
          npx electron-builder build --publish never --mac

      - name: Publish releases - Linux
        if: ${{ matrix.os == env.OS_LINUX }}
        env:
          # no hardlinks so dependencies are copied
          USE_HARD_LINKS: false
        run: |
          npx electron-builder build --publish never --linux

      # The Linux failures worth debugging leave their evidence outside the build's own
      # output: snapcraft's log holds the real mksquashfs error rather than the bare
      # "mksquashfs call failed:" that reaches the console, and if the kernel ever kills
      # the build for memory it names the process it chose only in dmesg.
      - name: Capture Linux failure diagnostics
        if: ${{ failure() && matrix.os == env.OS_LINUX }}
        run: |
          echo "=== kernel OOM activity ==="
          sudo dmesg --ctime 2>/dev/null | grep -iE "out of memory|oom-kill|killed process" || echo "(no OOM entries in dmesg)"
          echo "=== kernel log tail ==="
          sudo dmesg --ctime 2>/dev/null | tail -40 || true
          echo "=== memory ==="; free -h; swapon --show || true
          echo "=== disk ==="; df -h /

      - name: Upload snapcraft logs (Linux)
        if: ${{ failure() && matrix.os == env.OS_LINUX }}
        uses: actions/upload-artifact@v4
        with:
          name: snapcraft-logs
          path: |
            ~/.local/state/snapcraft/log/
          if-no-files-found: warn

      - name: Rename Windows exe to include GitHub Action Run ID
        if: ${{ matrix.os == env.OS_WINDOWS }}
        run: |
          Get-ChildItem -Path ./release/build/*.exe | ForEach-Object {
            if (-not ($_.Name -like "*Setup*.exe")) {
              $newName = "$($_.BaseName)-${{ github.run_id }}.exe"
              Rename-Item -Path $_.FullName -NewName $newName
              Write-Host "Renamed $($_.Name) to $newName"
            }
          }

      - name: Upload Windows artifacts
        if: ${{ matrix.os == env.OS_WINDOWS }}
        uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: |
            ./release/build/*.exe
            !./release/build/*Setup*.exe

      - name: Rename macOS dmg to include GitHub Action Run ID
        if: ${{ matrix.os == env.OS_MACOS }}
        run: |
          for file in ./release/build/*.dmg; do
            newName="${file%.dmg}-${{ github.run_id }}.dmg"
            mv "$file" "$newName"
            echo "Renamed $file to $newName"
          done

      - name: Upload macOS artifacts
        if: ${{ matrix.os == env.OS_MACOS }}
        uses: actions/upload-artifact@v4
        with:
          name: app-macos
          path: |
            ./release/build/*.dmg

      - name: Rename Linux snap to include GitHub Action Run ID
        if: ${{ matrix.os == env.OS_LINUX }}
        run: |
          for file in ./release/build/*.snap; do
            newName="${file%.snap}-${{ github.run_id }}.snap"
            mv "$file" "$newName"
            echo "Renamed $file to $newName"
          done

      - name: Upload Linux artifacts
        if: ${{ matrix.os == env.OS_LINUX }}
        uses: actions/upload-artifact@v4
        with:
          name: app-linux
          path: |
            ./release/build/*.snap

      # Enable tmate debugging of manually-triggered workflows if the input option was provided
      - name: Setup tmate session
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
